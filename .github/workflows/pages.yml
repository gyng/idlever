name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pages-production' || format('pages-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check formatting and lint
        run: |
          pnpm --dir web fmt:check
          pnpm --dir web lint
      - name: Test deployment metadata
        run: node --test tools/deployment-meta.test.mjs
      - name: Test WASM build target selection
        run: node --test tools/wasm-target.test.mjs
      - name: Test client identity and resume
        run: node --test tools/client-identity.test.mjs tools/client-resume.test.mjs
      - name: Test statistical tuning workflow
        run: node --test tools/stat-bounds.test.mjs tools/stat-tune.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test engine
        run: |
          cargo test -q --workspace --profile fast
          cargo test -q -p idlever-core --example dayplayer --profile fast
      - name: Lint engine
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Build release engine
        run: tools/wasm.sh --ship
      - name: Check chrome copy
        run: node tools/copy-lint.mjs
      - name: Build site
        run: pnpm --dir web build
        env:
          IDLEVER_BASE: /idlever/
      - name: Stamp deployment metadata
        run: node tools/deployment-meta.mjs web/dist "$(git rev-parse HEAD)" /idlever/ "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    # Publishing a versioned release (including an alpha) deploys its tagged build.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
